<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img">
  <title>RM — Rihanna Marie</title>
  <desc>Circular outline stamp logo for Rihanna Marie, cannabis retail strategist</desc>

  <rect width="512" height="512" fill="#F2EDE4"/>

  <defs>
    <path id="arcTop" d="M256,256 m-210,0 a210,210 0 1,1 420,0"/>
    <path id="arcBot" d="M256,256 m-210,0 a210,210 0 0,0 420,0"/>
  </defs>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="#1A1612" stroke-width="5"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#1A1612" stroke-width="1.5"/>

  <!-- Arc text top: RIHANNA · MARIE · CANNAWIZ · -->
  <text font-family="'DM Mono', 'Courier New', monospace" font-size="27" fill="#1A1612" letter-spacing="13">
    <textPath href="#arcTop" startOffset="5%">RIHANNA · MARIE · CANNAWIZ ·</textPath>
  </text>

  <!-- Arc text bottom: IN THE CANNABIZ · -->
  <text font-family="'DM Mono', 'Courier New', monospace" font-size="27" fill="#1B4D4A" letter-spacing="13">
    <textPath href="#arcBot" startOffset="16%">IN THE CANNABIZ ·</textPath>
  </text>

  <!-- Outline RM letterforms -->
  <text x="256" y="236"
    font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
    font-size="162" font-weight="900"
    text-anchor="middle"
    fill="none"
    stroke="#1A1612"
    stroke-width="4.5">RM</text>

  <!-- Teal shadow layer for depth -->
  <text x="258" y="238"
    font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
    font-size="162" font-weight="900"
    text-anchor="middle"
    fill="#1B4D4A"
    opacity="0.12">RM</text>

  <!-- Teal rule -->
  <rect x="100" y="248" width="312" height="4" fill="#1B4D4A"/>

  <!-- CALIFORNIA -->
  <text x="256" y="304"
    font-family="'DM Mono', 'Courier New', monospace"
    font-size="26" letter-spacing="12"
    text-anchor="middle"
    fill="#1A1612">CALIFORNIA</text>

  <!-- Side marks -->
  <line x1="10" y1="256" x2="28" y2="256" stroke="#1B4D4A" stroke-width="4"/>
  <line x1="484" y1="256" x2="502" y2="256" stroke="#1B4D4A" stroke-width="4"/>
</svg>
