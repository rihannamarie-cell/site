<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img">
  <title>RM — Rihanna Marie (dark version)</title>
  <desc>Circular outline stamp logo on dark ink background</desc>

  <rect width="512" height="512" fill="#1A1612"/>

  <defs>
    <path id="arcTopD" d="M256,256 m-210,0 a210,210 0 1,1 420,0"/>
    <path id="arcBotD" d="M256,256 m-210,0 a210,210 0 0,0 420,0"/>
  </defs>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="#F2EDE4" stroke-width="5"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#F2EDE4" stroke-width="1.5"/>

  <!-- Arc text top -->
  <text font-family="'DM Mono', 'Courier New', monospace" font-size="27" fill="#F2EDE4" letter-spacing="13">
    <textPath href="#arcTopD" startOffset="5%">RIHANNA · MARIE · CANNAWIZ ·</textPath>
  </text>

  <!-- Arc text bottom -->
  <text font-family="'DM Mono', 'Courier New', monospace" font-size="27" fill="#2E6E6A" letter-spacing="13">
    <textPath href="#arcBotD" startOffset="16%">IN THE CANNABIZ ·</textPath>
  </text>

  <!-- Outline RM -->
  <text x="256" y="236"
    font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
    font-size="162" font-weight="900"
    text-anchor="middle"
    fill="none"
    stroke="#F2EDE4"
    stroke-width="4.5">RM</text>

  <!-- Teal depth layer -->
  <text x="258" y="238"
    font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
    font-size="162" font-weight="900"
    text-anchor="middle"
    fill="#2E6E6A"
    opacity="0.2">RM</text>

  <!-- Teal rule -->
  <rect x="100" y="248" width="312" height="4" fill="#2E6E6A"/>

  <!-- CALIFORNIA -->
  <text x="256" y="304"
    font-family="'DM Mono', 'Courier New', monospace"
    font-size="26" letter-spacing="12"
    text-anchor="middle"
    fill="#F2EDE4">CALIFORNIA</text>

  <!-- Side marks -->
  <line x1="10" y1="256" x2="28" y2="256" stroke="#2E6E6A" stroke-width="4"/>
  <line x1="484" y1="256" x2="502" y2="256" stroke="#2E6E6A" stroke-width="4"/>
</svg>
